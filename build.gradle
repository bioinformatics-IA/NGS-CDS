plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'java'
id 'application'
//id 'com.bmuschko.izpack' version '3.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()

  maven {
        url "https://repo.jfree.org/artifactory/main/"
    }
//
 //gradlePluginPortal()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.2'
//https://github.com/bmuschko/gradle-izpack-plugin
//izpack 'org.codehaus.izpack:izpack-ant:5.1.3'
//classpath 'com.bmuschko:gradle-izpack-plugin:3.2'

    // This dependency is used by the application.
    implementation 'com.google.guava:guava:30.1.1-jre'


// https://mvnrepository.com/artifact/commons-io/commons-io
implementation("commons-io:commons-io:2.20.0")
//implementation group: 'commons-io', name: 'commons-io', version: '2.6'

// https://mvnrepository.com/artifact/net.sf.ucanaccess/ucanaccess
implementation group: 'net.sf.ucanaccess', name: 'ucanaccess', version: '5.0.1'

// https://mvnrepository.com/artifact/com.jcraft/jsch
implementation group: 'com.jcraft', name: 'jsch', version: '0.1.55'

// https://mvnrepository.com/artifact/org.apache.commons/commons-csv
implementation group: 'org.apache.commons', name: 'commons-csv', version: '1.11.0'

// https://mvnrepository.com/artifact/org.swinglabs.swingx/swingx-all
implementation group: 'org.swinglabs.swingx', name: 'swingx-all', version: '1.6.5-1'


// https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-api
implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.24.3'

implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.24.3'

// https://mvnrepository.com/artifact/org.apache.commons/commons-compress
implementation group: 'org.apache.commons', name: 'commons-compress', version: '1.27.1'

// https://mvnrepository.com/artifact/org.apache.poi/poi
implementation("org.apache.poi:poi:5.4.1")

// https://mvnrepository.com/artifact/com.google.code.gson/gson
implementation("com.google.code.gson:gson:2.13.1")

implementation 'com.formdev:flatlaf:3.2'

// https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-core
runtimeOnly group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.18.0'



}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        "-Xlint:deprecation",
        "-Xlint:unchecked"
    ]
}
application {
    // Define the main class for the application.
    mainClass = 'NGSGradle.App'
}

jar {
  manifest {
    attributes(
      'Main-Class': 'NGSGradle.App',
      'Class-Path': configurations.runtimeClasspath.collect { "lib/$it.name" }.join(' ')
    )
  }
}
/*
jar {
  manifest {
    attributes(
      'Main-Class': 'NGSGradle.App'
      'Class-Path': configurations.runtimeClasspath.collect { it.name }.join(' ')
     // 'Class-Path' : configurations.compile.collect { 'lib/' + it.getName() }.join(' ')
      //"Class-Path": configurations.compile.collect { it.getName() }.join(' ')
    )
  }
}
*/
tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
