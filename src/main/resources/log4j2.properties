status = debug
name = Log4j2PropertiesConfig
#appenders = file
#appender.file.type = File
#appender.file.name = FileLogger
#appender.file.filename = logs/app.log
#appender.file.layout.type = PatternLayout
#appender.file.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss}] [%-5p] [%c{1}] - %m%n

#rootLogger.level = debug
#rootLogger.appenderRefs = file
#rootLogger.appenderRef.file.ref = FileLogger

appenders = rollingFile

# Rolling File Appender for the Main Application Logs
appender.rollingFile.type = RollingFile
appender.rollingFile.name = AppLogger
# Current active log file
appender.rollingFile.fileName = logs/app.log
# Dated log files  
appender.rollingFile.filePattern = logs/app-%d{yyyy-MM-dd}.log
appender.rollingFile.layout.type = PatternLayout
appender.rollingFile.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss}] [%-5p] - %m%n
# Time-based rolling (Every day) 
appender.rollingFile.policies.type = Policies
appender.rollingFile.policies.time.type = TimeBasedTriggeringPolicy
appender.rollingFile.policies.time.interval = 1
appender.rollingFile.policies.time.modulate = true
# Log file retention (Keep last 30 days)
appender.rollingFile.strategy.type = DefaultRolloverStrategy
# Keeps only the last 30 days of logs
appender.rollingFile.strategy.max = 30  

# Logger for App.java AppLogger
logger.app.level = debug
# Prevents writing to rootLogger
logger.app.name = NGSGradle.App
logger.app.additivity = false  
logger.app.appenderRefs = rollingFile
logger.app.appenderRef.rollingFile.ref = AppLogger


# Root Logger (fallback)
rootLogger.level = debug
rootLogger.appenderRefs = rollingFile
rootLogger.appenderRef.rollingFile.ref = AppLogger
